name: Publication des signaux Telegram

on:
  schedule:
    - cron: "13,23,33,53 * * * *"
  workflow_dispatch:
    inputs:
      force_test:
        description: "Déclencher un jeu immédiatement"
        required: true
        default: false
        type: boolean
      test_game:
        description: "Jeu à déclencher"
        required: true
        default: swamp_land
        type: choice
        options:
          - swamp_land
          - kamikaze
          - apple_of_fortune
          - dragons_gold
          - eastern_night

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v5
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Publier le signal éventuel
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          FORCE_TEST: ${{ inputs.force_test || 'false' }}
          TEST_GAME: ${{ inputs.test_game || 'swamp_land' }}
        run: python publish_once.py
